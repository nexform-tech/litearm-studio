# Real toolchain gate for litearm-studio (React + Vite web UI).
#
# Adapted from the repository-standards placeholder, which was a test gate for a
# documentation-only repository and asked to be replaced by the project's real
# toolchain as soon as source code landed.
#
# The job id stays `test`: branch protection on the default branch requires a
# status check with exactly that name.
name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true # a superseded pull request run is pointless

jobs:
  test:
    runs-on: ubuntu-22.04
    env:
      # 机器人模型不在仓里: dev/build/test 各自去上游取到 .cache/description/，再减面成
      # public/description/ 的预览。CI 按 description.lock.json 取那一版并核对哈希 ——
      # 与发布产物同一份原始字节, 而且上游挪了 tag 会在这里判失败, 不会静默换掉字节。
      LITEARM_DESCRIPTION_MODE: locked
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          path: litearm-studio
          # 两个 SDK 是本仓的 submodule（sdk/），tag 即版本 —— 一次检出全部到位。
          submodules: recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: litearm-studio
        run: pnpm install --frozen-lockfile

      - name: Lint (oxlint)
        working-directory: litearm-studio
        run: pnpm lint

      - name: Typecheck
        working-directory: litearm-studio
        run: pnpm exec tsc -b

      - name: Unit tests (Vitest)
        working-directory: litearm-studio
        run: pnpm test

      - name: Production build
        working-directory: litearm-studio
        run: pnpm build

      # ---- 本地守护进程 (Python) ----
      # 它同样跑在必需的 `test` 检查里: 只挂在另一个 job 上的话, Python 侧的失败
      # 挡不住合并。
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the SDKs and the daemon
        working-directory: litearm-studio
        run: |
          python -m pip install --upgrade pip
          # 两个 SDK 都不在 PyPI 上: 从本仓的 submodule 装, 与 `make sdk` 完全一致。
          pip install ./sdk/litearm-python ./sdk/litegrip-python
          # ⚠ PyInstaller 不只是打包工具: `packaging/tests` 里四条断言 PyInstaller
          #   hook 行为的用例要 import 它, 而 `importorskip` 在缺它时会让那四条**跳过**
          #   —— 于是 hook 的回归只有到发布构建才看得见。发布任务本来就装它, 这里跟上。
          pip install -e "daemon[test]" pyinstaller

      # The packaging tests run here too: `packaging/tests` builds a real `.deb` with
      # dpkg-deb, and the release-time `package` job only runs when a new version is
      # published. Without this step the packaging path would have no per-PR verification
      # at all.
      - name: Python unit tests (pytest)
        working-directory: litearm-studio
        run: python -m pytest daemon/tests packaging/tests -q

      - name: Validate repository standards
        working-directory: litearm-studio
        run: |
          set -euo pipefail
          test -s README.md
          test -s LICENSE
          python3 -c "import json; json.load(open('.releaserc.json'))"
          python3 -c "import json; json.load(open('.markdownlint.json'))"
          echo "repository standards OK"
