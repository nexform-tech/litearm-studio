# Real toolchain gate for litearm-studio (React + Vite web UI).
#
# Adapted from the repository-standards placeholder, which was a test gate for a
# documentation-only repository and asked to be replaced by the project's real
# toolchain as soon as source code landed.
#
# The job id stays `test`: branch protection on the default branch requires a
# status check with exactly that name.
name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true # a superseded pull request run is pointless

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          path: litearm-studio

      # The web UI still consumes the packaged browser bundle of the JS SDK
      # (package.json: `litearm-js: file:../litearm-js`), and that import
      # resolves to dist/, so the SDK has to be built and not merely cloned.
      # The local control daemon replaces this dependency; see
      # docs/REFACTOR_PLAN.md.
      - name: Checkout LiteArm JS SDK
        uses: actions/checkout@v4
        with:
          repository: nexform-tech/litearm-js
          path: litearm-js

      - name: Build LiteArm JS SDK
        working-directory: litearm-js
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: litearm-studio
        run: pnpm install --frozen-lockfile

      - name: Lint (oxlint)
        working-directory: litearm-studio
        run: pnpm lint

      - name: Typecheck
        working-directory: litearm-studio
        run: pnpm exec tsc -b

      - name: Unit tests (Vitest)
        working-directory: litearm-studio
        run: pnpm test

      - name: Production build
        working-directory: litearm-studio
        run: pnpm build

      # ---- 本地守护进程 (Python) ----
      # 它同样跑在必需的 `test` 检查里: 只挂在另一个 job 上的话, Python 侧的失败
      # 挡不住合并。
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # litearm-python 不在 PyPI 上, 只能从它自己的仓库检出后装。
      - name: Checkout LiteArm Python SDK
        uses: actions/checkout@v4
        with:
          repository: nexform-tech/litearm-python
          path: litearm-python

      - name: Install the SDK and the daemon
        working-directory: litearm-studio
        run: |
          python -m pip install --upgrade pip
          pip install -e ../litearm-python
          pip install -e "daemon[test]"

      - name: Daemon unit tests (pytest)
        working-directory: litearm-studio
        run: python -m pytest daemon/tests -q

      - name: Validate repository standards
        working-directory: litearm-studio
        run: |
          set -euo pipefail
          test -s README.md
          test -s AGENTS.md
          test -s LICENSE
          python3 -c "import json; json.load(open('.releaserc.json'))"
          python3 -c "import json; json.load(open('.markdownlint.json'))"
          echo "repository standards OK"
