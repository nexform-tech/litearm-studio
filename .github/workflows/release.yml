# Copy this file into a downstream repository as `.github/workflows/release.yml`.
# `scripts/sync.sh` does that automatically when the file does not exist yet.
#
# This is the source-only shape: compute the version, create the tag, create the
# GitHub release. GitHub attaches the source tarball and zip to every release by
# itself, so nothing else is required.
#
# Add the `publish` job from examples/publish.yml when the repository publishes to
# a registry, and the `package` job from examples/package.yml when it ships build
# artifacts. Both are independent siblings of `release`: add or delete them freely.
name: Release

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: write # create the tag and the GitHub release
  issues: write # comment on released issues
  pull-requests: write # comment on released pull requests

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false # never cancel a release mid-flight

jobs:
  # Versioning only: commit prefixes -> tag -> GitHub release. Language-agnostic.
  release:
    # Pin to a moving major tag (`@v1`), or to a commit SHA for maximum safety.
    uses: nexform-tech/repo-template/.github/workflows/release.yml@v1

  # 打包 (计划 Phase 5): Windows / Linux 各一个单文件可执行程序, 挂到刚发的 release。
  # 只有真的发了新版才跑 (`needs.release.outputs.new_tag`), 否则纯属浪费 runner。
  package:
    needs: release
    if: needs.release.outputs.new_tag != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            suffix: linux-amd64
          - os: windows-latest
            suffix: windows-amd64.exe
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write # attach artifacts to the GitHub release
    env:
      VERSION: ${{ needs.release.outputs.new_tag }}
    steps:
      - name: Checkout Studio
        uses: actions/checkout@v4
        with:
          path: litearm-studio

      # litearm-python 不在 PyPI 上, 必须从它自己的仓库检出 (与 ci.yml 同一做法)。
      - name: Checkout LiteArm Python SDK
        uses: actions/checkout@v4
        with:
          repository: nexform-tech/litearm-python
          path: litearm-python

      # 夹爪 SDK 只在 Linux 上安装: 它 import 时需要 fcntl / PF_CAN, Windows 上装了
      # 也没用。钉在 v0.4.0 —— 与 ci.yml 同一个版本, 打包时按名字载入标定模板这一
      # 能力就是它引入的。Windows 产物因此**不含**夹爪 (D10: 缺席, 不是禁用)。
      - name: Checkout the LiteGrip SDK
        if: runner.os == 'Linux'
        uses: actions/checkout@v4
        with:
          repository: nexform-tech/litegrip-python
          ref: v0.4.0
          path: litegrip-python

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 先把界面构建出来 —— 打包脚本会拒绝在没有 dist/ 的情况下继续。
      - name: Build the UI
        working-directory: litearm-studio
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Install the window stack (Linux)
        if: runner.os == 'Linux'
        # ⚠ 这一条决定 Linux 产物是 63 MB 还是 243 MB。借系统的 WebKitGTK 就把
        # `libwebkit2gtk`（94 MB）留在用户机器上、由 `.deb` 的 `Depends` 要过来；
        # 装不上它时 `LITEARM_STUDIO_WINDOW_BACKEND=gtk` 会让构建**判失败**，而不是
        # 静默换成自带 Qt 的 243 MB 产物（见 packaging/build.py）。
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi python3-venv gir1.2-webkit2-4.1

      - name: Install the SDK, the daemon and PyInstaller
        working-directory: litearm-studio
        shell: bash # 两条分支都要能在两个平台上写成同一段
        run: |
          # ⚠ Linux 上必须用**系统解释器**建 venv, 不能用 `actions/setup-python` 那个。
          # `apt install python3-gi` 装的是**系统 python** 的绑定, setup-python 的解释器
          # (v0.17.2 那次是 3.12) 看不见它 —— `import gi` 失败, 于是 GTK 后端判不可用,
          # 发布构建当场失败、Linux 产物一个都没有。`--system-site-packages` 就是那条
          # 让 venv 看得见 `python3-gi` 的通道。
          # ⚠ PyGObject 本身**不能**用 pip 装: 它只有 sdist, 编译要一整套开发包, 而
          # typelib 始终来自系统。
          if [ "${{ runner.os }}" = "Linux" ]; then
            python3 -m venv --system-site-packages .venv-build
            PY="$PWD/.venv-build/bin/python"
          else
            PY=python
          fi
          echo "PYTHON=$PY" >> "$GITHUB_ENV"
          "$PY" -m pip install --upgrade pip
          "$PY" -m pip install -e ../litearm-python
          if [ "${{ runner.os }}" = "Linux" ]; then
            "$PY" -m pip install ../litegrip-python
          fi
          # ⚠ 窗口依赖是**打包必需**的, 不是可选的: `packaging/build.py` 的
          # `window_build_args()` 在缺 pywebview 时直接判失败 —— 一个开不了窗口的产物
          # 里"关掉窗口就是退出"根本无从谈起。
          # ⚠ 这里**不**装 `ui-qt`: 那会把 Qt WebEngine 拉进构建机, 而它只在拿不到
          # 系统 GTK 时才是需要的后端。
          "$PY" -m pip install -e "daemon[test,ui]" pyinstaller

      - name: Check the window backend is the one we think it is
        if: runner.os == 'Linux'
        working-directory: litearm-studio
        # 先单独问一次, 让"后端不可用"以一行读得懂的原因失败, 而不是埋在 PyInstaller
        # 参数里。这一步与下面那次构建用的是同一个解释器。
        run: |
          "$PYTHON" -c "import gi; gi.require_version('WebKit2', '4.1'); \
            from gi.repository import WebKit2; print('PyGObject and WebKit2 are visible to', '$PYTHON')"

      - name: Package (one-file executable)
        working-directory: litearm-studio
        env:
          LITEARM_STUDIO_VERSION: ${{ needs.release.outputs.new_tag }}
          # ⚠ 显式钉住后端, 不靠自动判据: Linux 走 GTK（见上面那步）, 其余平台用系统
          # 自带的内核。写死之后, 构建机上少了谁都会**当场失败**, 而不是换一个体积
          # 差 4 倍的后端悄悄发出去。
          LITEARM_STUDIO_WINDOW_BACKEND: ${{ runner.os == 'Linux' && 'gtk' || 'native' }}
          # 激活服务地址：在仓库变量里改（Settings → Secrets and variables →
          # Actions → Variables），不必改工作流，也不必让用户设环境变量。
          # 不设置 = 用 daemon 里的内置生产地址（见 activation.PRODUCTION_ACTIVATION_URL）。
          LITEARM_ACTIVATION_URL: ${{ vars.LITEARM_ACTIVATION_URL }}
        # ⚠ `shell: bash` 是必需的: `$PYTHON` 是上面那步写进 `GITHUB_ENV` 的, 而 Windows
        # 的默认 shell 是 pwsh, 在那里它读不到。两条分支都用 bash 才不会一边悄悄跑错解释器。
        shell: bash
        run: '"$PYTHON" packaging/build.py'

      - name: Name the artifact (unix)
        if: runner.os != 'Windows'
        working-directory: litearm-studio
        shell: bash # `${VERSION#v}` 是 bash 展开, 显式声明免得默认 shell 变了就悄悄出错
        run: |
          mkdir -p upload
          cp packaging/dist/litearm-studio-daemon \
             "upload/litearm-studio-${VERSION#v}-${{ matrix.suffix }}"

      # Ubuntu and Debian users get a real package. It is the only artifact that can set
      # the serial-port permission (a udev rule with `uaccess`, so no `dialout` group and
      # no re-login) and register a desktop entry, which is what "install" means to them.
      # The standalone executable above is still published for every other Linux.
      - name: Build the Debian package
        if: runner.os == 'Linux'
        working-directory: litearm-studio
        # ⚠ 用与构建可执行文件**同一个**解释器: `deb.py` 不需要 gi, 但它要与 `$PYTHON`
        # 那次构建的后端选择一致 (见 `WINDOW_BACKEND_ENV` 的默认值取自环境)。
        shell: bash
        run: |
          "$PYTHON" packaging/deb.py \
            --binary packaging/dist/litearm-studio-daemon \
            --version "$VERSION" \
            --outdir upload

      - name: Name the artifact (windows)
        if: runner.os == 'Windows'
        working-directory: litearm-studio
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force upload | Out-Null
          $v = "$env:VERSION".TrimStart('v')
          Copy-Item packaging/dist/litearm-studio-daemon.exe "upload/litearm-studio-$v-${{ matrix.suffix }}"

      # 产物的 sha256 也一起发出去, 便于安装侧校验。纯 Python 脚本而不是内联 shell:
      # Windows 的默认 shell 是 pwsh, `python - <<'PY'` 在那边是语法错误 (实测 CI 被它判失败)。
      - name: Checksums
        working-directory: litearm-studio
        run: python packaging/checksums.py upload

      - name: Attach artifacts to the release
        working-directory: litearm-studio
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$VERSION" upload/* --clobber
