[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "litearm-studio-daemon"
# ⚠ 占位版本号 —— 与 AGENTS.md §3「manifest 的 version 保持占位符」同一意图,
# 但**写法必须改**: 规范原文的 `0.0.0-semantic-release` **不是合法的 PEP 440
# 版本号**, setuptools 会在 `pip install -e` 时直接拒绝
# (`configuration error: project.version must be pep440`) —— 这也是兄弟仓
# litearm-python 的 pyproject 里写着实际版本号 `2.1.0` 的原因。
# PEP 440 允许的本地版本段用 `+`, 故写成 `0.0.0+semantic-release`: 语义相同
# (0.0.0 + 标记 semantic-release), 且合法。
# 本包**不发布到任何索引** (release.yml 是 source-only 形态, 没有 publish job),
# 所以这个字段是惰性的 —— git tag 仍然是唯一版本来源, 不要把它当"当前版本"。
version = "0.0.0+semantic-release"
description = "LiteArm Studio 本地程序 —— 单臂会话 + 状态推送 + 命令执行的本地守护进程"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
# ⚠ `litearm` (仓库 nexform-tech/litearm-python) **不在 PyPI 上**, 所以**不能**写进
# dependencies: 写进去会让 `pip install` 在这里 404。它必须从本地 checkout 安装
# (`pip install -e ../litearm-python`), 见 README 的「依赖」一节。
# `pyserial` 由 `litearm` 自己带入, 这里不重复声明。
#
# ⚠ `litegrip` (仓库 nexform-tech/litegrip-python) **同样不在 PyPI 上**, 也**不能**
# 写进 dependencies —— 同上会 404。它还必须从 checkout 装 (`pip install ../litegrip-python`),
# 而且只在 Linux 上有意义 (import 需要 fcntl / PF_CAN, Windows 上会抛)。见 README 的
# 「夹爪」与「打包」两节, 以及 packaging/build.py 里按平台收 SDK 的判据。
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    # ⚠ 结构化日志 (issue #79) **刻意不引三方库**: 记录 schema 是自己的
    # (`obs/schema.py`, 字段名照 OpenTelemetry 的日志数据模型), 写入是标准库的
    # `logging.handlers.RotatingFileHandler` + 一个自定义 Formatter, trace/span 上下文
    # 用标准库的 `contextvars`。评估过 structlog: 它的两个卖点 (处理器链、上下文绑定)
    # 在这里分别由"一条 Formatter"与"两个 ContextVar"承担, 而它并不解决真正难的那一步
    # ——在轮转下保证整行原子写入。见 `obs/__init__.py` 的模块说明。
    # 固件升级（USB DFU）的烧录引擎。**在 PyPI 上**，所以可以正常声明 —— 与
    # `litearm` / `litegrip` 那两个必须从 checkout 装的 SDK 不同。
    #
    # ⚠ `libusb-package` 不是可选的：pyusb 靠 `ctypes.util.find_library` 找 libusb，
    #   而它在 Windows 上只查系统目录 ⇒ 返回 None ⇒ pyusb **静默地没有后端**
    #   （`usb.core.find()` 恒为空，看着像"设备不在"）。`libusb-package` 自带 DLL 且
    #   按绝对路径加载；`dfu/engine.py` 的 `_load_backend()` **优先**用它。
    "pyusb",
    "libusb-package",
]

[project.optional-dependencies]
# 测试依赖 (pytest 放 extra, 生产运行不需要它)。
# `httpx` 只有一处用途: `fastapi.testclient.TestClient` 要它做 HTTP 传输。
test = ["pytest>=7", "httpx"]

[project.scripts]
litearm-studio-daemon = "litearm_studio_daemon.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
litearm_studio_daemon = ["py.typed"]
